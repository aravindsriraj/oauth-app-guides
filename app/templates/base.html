<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OAuth App Guides{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2330; --ink-2: #4a5566; --ink-3: #737d8c; --paper: #f3f5f4; --card: #ffffff; --line: #dfe4e1; --soft: #eef1ef;
  --tested: #1f7a4d; --tested-bg: #e3f3ea; --sourced: #2b58c4; --sourced-bg: #e6edfb;
  --uncertain: #a86200; --uncertain-bg: #fbf0dc; --hard: #b3261e; --hard-bg: #fdf1f0; --hard-line: #f0c8c4; --focus: #2b58c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e7ebf0; --ink-2: #b4bdc9; --ink-3: #8b95a4; --paper: #12171e; --card: #1a2029; --line: #2c3440; --soft: #222a35;
    --tested: #5cc98d; --tested-bg: #16301f; --sourced: #86a8f5; --sourced-bg: #18233d;
    --uncertain: #f0ad4e; --uncertain-bg: #36290f; --hard: #f2817a; --hard-bg: #2e1a1a; --hard-line: #5a2c2a; --focus: #86a8f5;
  }
}
:root[data-theme="dark"] {
  --ink: #e7ebf0; --ink-2: #b4bdc9; --ink-3: #8b95a4; --paper: #12171e; --card: #1a2029; --line: #2c3440; --soft: #222a35;
  --tested: #5cc98d; --tested-bg: #16301f; --sourced: #86a8f5; --sourced-bg: #18233d;
  --uncertain: #f0ad4e; --uncertain-bg: #36290f; --hard: #f2817a; --hard-bg: #2e1a1a; --hard-line: #5a2c2a; --focus: #86a8f5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15.5px/1.6 "Public Sans", system-ui, sans-serif; }
a { color: var(--sourced); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; }
h1 { font-size: clamp(28px, 4.5vw, 40px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 800; margin: 0 0 10px; }
h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 4px; }
p { max-width: 68ch; }
.muted { color: var(--ink-3); font-size: 13.5px; }

/* top bar */
.topbar { background: var(--card); border-bottom: 1px solid var(--line); }
.topbar .in { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand { color: var(--ink); text-decoration: none; font-weight: 800; letter-spacing: -0.01em; }
.brand span { color: var(--ink-3); font-weight: 400; font-size: 13.5px; margin-left: 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.page { max-width: 1160px; margin: 0 auto; padding: 32px 24px 80px; }

/* buttons */
.btn { font: 700 15px "Public Sans", sans-serif; background: var(--ink); color: var(--paper); border: 0; border-radius: 10px;
  padding: 12px 20px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.quiet { background: var(--card); color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
.btn.quiet:hover { color: var(--ink); border-color: var(--ink-3); }

/* shared pieces */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
.dot.tested { background: var(--tested); } .dot.sourced { background: var(--sourced); } .dot.uncertain { background: var(--uncertain); }
.level { font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 10px; }
.level.easy { color: var(--tested); } .level.medium { color: var(--uncertain); } .level.hard { color: var(--hard); }
.meter { display: inline-flex; gap: 3px; } .meter i { width: 18px; height: 7px; border-radius: 4px; background: var(--line); }
.level .meter i.on { background: currentColor; }
.warn { display: flex; flex-wrap: wrap; gap: 6px; }
.warn span { font-size: 12.5px; font-weight: 600; color: var(--hard); background: var(--hard-bg); border: 1px solid var(--hard-line); border-radius: 6px; padding: 1px 8px; }
.badge { font-size: 12px; font-weight: 700; color: var(--tested); background: var(--tested-bg); border-radius: 10px; padding: 1px 8px; }
.legend { font-size: 13px; color: var(--ink-3); line-height: 2; }
.legend .dot { margin-right: 6px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .fresh { animation: in .3s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(3px); } } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="/">OAuth App Guides<span>for apps your agent connects through Composio</span></a>
  <div class="actions">{% block actions %}{% endblock %}</div>
</div></header>
<main class="page">{% block main %}{% endblock %}</main>
<script>
document.querySelectorAll("button[data-copy]").forEach(b => b.addEventListener("click", async () => {
  const label = b.textContent;
  try { await navigator.clipboard.writeText(b.dataset.copy || location.href); b.textContent = "Copied"; } catch { b.textContent = "Copy failed"; }
  setTimeout(() => b.textContent = label, 1500);
}));
</script>
</body>
</html>
